# agents.toml — the agents layer: which roles this repo has.
# step.toml / done.toml name a performer and its gates by section name; the
# [<name>] sections here declare those names and their role.
# See "satelle help agent-dispatch" and "satelle help global-agents".
#
# Execution detail (command, model, tools, effort) lives machine-side, not
# here (satelle sty_156ecb5a): this machine's agents.local.toml names a profile
# from the machine-wide catalog (~/.satelle/agents.toml) for each seat. The
# in-loop executor (the driving session) is the one seat that keeps its command.

[executor]
role    = "agent"              # declared contract (agent | reviewer); do not leave inferred
command = "in-loop"            # the orchestrator/driving session itself
principles = "session"

# Read-only gate reviewer. Judges, never mutates.
[reviewer]
role       = "reviewer"
principles = "session"

# Planner for the `plan` step (agent = "planner"): read-only, returns the plan
# artifact, which satelle attaches. Plans only — does not implement or advance
# status. tools = "Read" is the context channel the node.alloc check needs in
# this shared file, which is validated alone; the machine-side grant replaces it.
[planner]
role       = "agent"
principles = "session"
tools      = "Read"

# [model_order] — the order an UNSET model follows (sty_4fde0a50), one list per
# executable (e.g. claude). A binding that leaves model= empty and has no
# same-executable inherited or creator session model takes the FIRST entry of ITS
# OWN executable's list; a name from one list is never applied to another
# executable. An entry is a name, or an array of names that are one rank (an
# alias and its resolved id, e.g. ["opus", "claude-opus-5-5"]); the first name is
# applied. An executable with no list falls back to the CLI's own default. A
# binding's model= pin always wins. See "satelle help agent-dispatch" § Model selection.
[model_order]
claude = ["opus", "sonnet", "haiku"]
